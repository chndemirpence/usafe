name: Windows controller build

on:
  workflow_dispatch:
  push:
    branches: [codex/usafe-secure-updates]
    paths:
      - desktop/**
      - .github/workflows/windows-controller.yml

permissions:
  contents: read

jobs:
  controller:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-updates.txt
      - name: Run desktop regression tests
        run: python -m unittest discover -v
      - name: Verify official Tor runtime signatures and checksums
        run: python prepare_runtime.py --cache "$env:RUNNER_TEMP/tor-cache" --gpg "C:/Program Files/Git/usr/bin/gpg.exe"
      - name: Build controller from this commit
        run: python build_windows.py --dist "$env:RUNNER_TEMP/controller-build"
      - name: Record build identity
        run: |
          $candidateExe = Join-Path $env:RUNNER_TEMP 'controller-build/USAFE Connect/USAFE Connect.exe'
          $identity = [ordered]@{commit=$env:GITHUB_SHA; repository=$env:GITHUB_REPOSITORY; run=$env:GITHUB_RUN_ID; artifact='USAFE Connect.exe'; sha256=(Get-FileHash -LiteralPath $candidateExe -Algorithm SHA256).Hash; signingStatus='unsigned build candidate'}
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'controller-build/build-identity.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usafe-windows-controller-${{ github.sha }}
          path: ${{ runner.temp }}/controller-build/
          retention-days: 7
          if-no-files-found: error
